<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="plateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left weight plate -->
  <circle cx="20" cy="50" r="15" fill="url(#plateGradient)" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="20" cy="50" r="8" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Right weight plate -->
  <circle cx="80" cy="50" r="15" fill="url(#plateGradient)" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="80" cy="50" r="8" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Barbell bar -->
  <rect x="35" y="47" width="30" height="6" fill="url(#barGradient)" rx="3"/>

  <!-- Handle grip -->
  <rect x="42" y="45" width="16" height="10" fill="none" stroke="#6b7280" stroke-width="1" rx="2"/>

  <!-- Weight markings -->
  <circle cx="20" cy="40" r="1.5" fill="#1a1a1a" opacity="0.6"/>
  <circle cx="20" cy="50" r="1.5" fill="#1a1a1a" opacity="0.6"/>
  <circle cx="20" cy="60" r="1.5" fill="#1a1a1a" opacity="0.6"/>

  <circle cx="80" cy="40" r="1.5" fill="#1a1a1a" opacity="0.6"/>
  <circle cx="80" cy="50" r="1.5" fill="#1a1a1a" opacity="0.6"/>
  <circle cx="80" cy="60" r="1.5" fill="#1a1a1a" opacity="0.6"/>
</svg>